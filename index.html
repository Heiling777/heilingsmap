<!DOCTYPE html>
<html>
<head>
    <title>我的足迹</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #fce4ec; }
        #map { height: 100vh; width: 100%; background-color: #fce4ec; }

        /* 💖 魔法滤镜：把高德图变成极简粉底蓝水 */
        /* invert(1) 反色让水变深，hue-rotate 统一色调，saturate 让水变蓝，brightness 提亮陆地 */
        .leaflet-tile-pane {
            filter: invert(1) hue-rotate(180deg) brightness(1.3) sepia(0.5) hue-rotate(300deg) saturate(1.5) contrast(0.9);
        }

        /* 弹窗样式 */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            color: #333;
        }
        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.98);
        }
        .leaflet-popup-content {
            margin: 20px;
            line-height: 1.7;
            font-size: 15px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 输入框和按钮 */
        .popup-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ffb6c1;
            border-radius: 8px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            font-size: 14px;
            background-color: #fff9fa;
        }
        .popup-input:focus { outline: none; border-color: #ff69b4; background-color: #fff; }
        
        .popup-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .popup-btn:hover { background-color: #ff1493; }

        /* 批注列表 */
        .msg-list { margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .msg-item { 
            border-bottom: 1px dashed #eee; 
            padding: 10px 0; 
            font-size: 15px;
            color: #444;
            word-wrap: break-word;
        }
        .msg-item:last-child { border-bottom: none; padding-bottom: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([23.1291, 113.2644], 12);

        // 使用国内 100% 能加载出来的图源
        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            attribution: '© 高德地图',
            maxZoom: 18
        }).addTo(map);

        // 深粉色水滴地标
        var pinkIcon = L.divIcon({
            className: 'custom-marker',
            html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" fill="#ff1493" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path>
                    <circle cx="12" cy="9" r="3" fill="#ffffff"></circle>
                   </svg>`,
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -32]
        });

        var markers = {};

        function loadAllMarkers() {
            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');
            for (var key in allNotes) {
                var coords = key.split(',');
                var lat = parseFloat(coords[0]);
                var lng = parseFloat(coords[1]);
                createOrUpdateMarker(lat, lng, allNotes[key]);
            }
        }

        function createOrUpdateMarker(lat, lng, notes) {
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            if (markers[key]) {
                markers[key].setPopupContent(generatePopupHTML(lat, lng, notes));
                return;
            }
            var marker = L.marker([lat, lng], { icon: pinkIcon }).addTo(map);
            marker.bindPopup(generatePopupHTML(lat, lng, notes));
            markers[key] = marker;
        }

        function generatePopupHTML(lat, lng, notes) {
            var notesHTML = notes.map(function(note) {
                return `<div class="msg-item">${note}</div>`;
            }).join('');

            return `
                <div style="width: 280px;">
                    <div class="msg-list">${notesHTML}</div>
                    <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
                        <textarea class="popup-input" placeholder="在这个地方，你想留下什么？"></textarea>
                        <button class="popup-btn" onclick="addNote(${lat}, ${lng}, this)">留下足迹</button>
                    </div>
                </div>
            `;
        }

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');

            if (!allNotes[key]) {
                allNotes[key] = [];
            }

            if (!markers[key]) {
                var marker = L.marker([lat, lng], { icon: pinkIcon }).addTo(map);
                marker.bindPopup(generatePopupHTML(lat, lng, allNotes[key])).openPopup();
                markers[key] = marker;
            }
        });

        function addNote(lat, lng, btn) {
            var textarea = btn.previousElementSibling;
            var content = textarea.value.trim();
            if (!content) return;

            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            allNotes[key].push(content);
            localStorage.setItem('myMapNotes', JSON.stringify(allNotes));

            var marker = markers[key];
            if (marker) {
                marker.setPopupContent(generatePopupHTML(lat, lng, allNotes[key]));
            }
        }

        loadAllMarkers();
    </script>
</body>
</html>
