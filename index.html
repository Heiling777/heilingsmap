<!DOCTYPE html>
<html>
<head>
    <title>我的足迹</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        /* 把地图变成浅粉色 */
        .leaflet-tile-pane {
            filter: sepia(0.6) saturate(2.5) hue-rotate(310deg) brightness(1.05);
        }
        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.2);
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.95);
        }
        .popup-input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ffb6c1;
            border-radius: 5px;
            resize: vertical;
            min-height: 60px;
        }
        .popup-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .popup-btn:hover { background-color: #ff1493; }
        .msg-list { margin-top: 10px; max-height: 150px; overflow-y: auto; }
        .msg-item { 
            border-bottom: 1px solid #eee; 
            padding: 5px 0; 
            font-size: 14px;
            color: #333;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20, 0], 2);

        // 这里已经填入了你的专属 API Key
        L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_5fvj_1_73567b6107ac9f11563207c5', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            var popupContent = `
                <div style="width: 200px;">
                    <textarea class="popup-input" placeholder="写下你的批注或感想..."></textarea>
                    <button class="popup-btn" onclick="addNote(${lat}, ${lng}, this)">添加批注</button>
                    <div class="msg-list" id="msg-list-${lat}-${lng}"></div>
                </div>
            `;

            L.popup({ className: 'custom-popup' })
                .setLatLng(e.latlng)
                .setContent(popupContent)
                .openOn(map);
        });

        function addNote(lat, lng, btn) {
            var textarea = btn.previousElementSibling;
            var content = textarea.value.trim();
            if (!content) return;

            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            
            if (!allNotes[key]) {
                allNotes[key] = [];
            }
            allNotes[key].push(content);
            
            localStorage.setItem('myMapNotes', JSON.stringify(allNotes));

            textarea.value = '';
            renderMessages(lat, lng);
        }

        function renderMessages(lat, lng) {
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');
            var msgs = allNotes[key] || [];
            
            var listDiv = document.getElementById(`msg-list-${lat}-${lng}`);
            if (listDiv) {
                listDiv.innerHTML = msgs.map(m => `<div class="msg-item">💬 ${m}</div>`).join('');
            }
        }
    </script>
</body>
</html>
