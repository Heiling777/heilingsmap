<!DOCTYPE html>
<html>
<head>
    <title>我的足迹</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* 纯净粉色滤镜：增加了对比度，让河流湖泊的蓝色更明显，淡化陆地 */
        .leaflet-tile-pane {
            filter: sepia(1) saturate(2.8) hue-rotate(315deg) brightness(1.05) contrast(1.15);
        }

        /* 极简风格的白色弹窗 */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            color: #333;
        }
        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.98);
        }
        .leaflet-popup-content {
            margin: 18px;
            line-height: 1.6;
            font-size: 15px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 输入框和按钮 */
        .popup-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #b0d4ff;
            border-radius: 8px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            font-size: 14px;
        }
        .popup-input:focus { outline: none; border-color: #66a3ff; }
        
        .popup-btn {
            background-color: #66a3ff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .popup-btn:hover { background-color: #4d8ce6; }

        /* 已写好的批注列表 */
        .msg-list { margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .msg-item { 
            border-bottom: 1px dashed #eee; 
            padding: 10px 0; 
            font-size: 15px;
            color: #444;
            word-wrap: break-word;
        }
        .msg-item:last-child { border-bottom: none; padding-bottom: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 初始化地图：聚焦广州，缩放级别调为 11
        var map = L.map('map').setView([23.1291, 113.2644], 11);

        // 底图：使用 Voyager 风格（这条风格的河流湖泊本身就是蓝色，配合滤镜效果极佳）
        L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_5fvj_1_73567b6107ac9f11563207c5', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);

        // 自定义浅蓝色水滴地标图标
        var blueIcon = L.divIcon({
            className: 'custom-blue-marker',
            html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" fill="#8ab4f8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path>
                    <circle cx="12" cy="9" r="3" fill="#ffffff"></circle>
                   </svg>`,
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -32]
        });

        // 用于存放所有已生成的地标，防止重复渲染
        var markers = {};

        // 渲染已有数据（页面加载时运行一次）
        function loadAllMarkers() {
            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');
            for (var key in allNotes) {
                var coords = key.split(',');
                var lat = parseFloat(coords[0]);
                var lng = parseFloat(coords[1]);
                createOrUpdateMarker(lat, lng, allNotes[key]);
            }
        }

        // 创建或更新一个地标
        function createOrUpdateMarker(lat, lng, notes) {
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            
            // 如果已经有这个地标，就只更新弹窗内容
            if (markers[key]) {
                markers[key].setPopupContent(generatePopupHTML(lat, lng, notes));
                return;
            }

            // 如果没有，就新建一个浅蓝色地标
            var marker = L.marker([lat, lng], { icon: blueIcon }).addTo(map);
            marker.bindPopup(generatePopupHTML(lat, lng, notes));
            markers[key] = marker;
        }

        // 生成弹窗的 HTML（批注列表 + 输入框）
        function generatePopupHTML(lat, lng, notes) {
            var notesHTML = notes.map(function(note) {
                return `<div class="msg-item">${note}</div>`;
            }).join('');

            return `
                <div style="width: 260px;">
                    <div class="msg-list">${notesHTML}</div>
                    <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
                        <textarea class="popup-input" placeholder="在这个地方，你想留下什么？"></textarea>
                        <button class="popup-btn" onclick="addNote(${lat}, ${lng}, this)">留下足迹</button>
                    </div>
                </div>
            `;
        }

        // 地图点击事件：只能在空白处点出新地标
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');

            // 如果这个点还没有任何批注，先建一个空列表
            if (!allNotes[key]) {
                allNotes[key] = [];
            }

            // 创建新地标并自动打开弹窗
            if (!markers[key]) {
                var marker = L.marker([lat, lng], { icon: blueIcon }).addTo(map);
                marker.bindPopup(generatePopupHTML(lat, lng, allNotes[key])).openPopup();
                markers[key] = marker;
            }
        });

        // 添加批注的函数
        function addNote(lat, lng, btn) {
            var textarea = btn.previousElementSibling;
            var content = textarea.value.trim();
            if (!content) return;

            var allNotes = JSON.parse(localStorage.getItem('myMapNotes') || '{}');
            var key = lat.toFixed(5) + ',' + lng.toFixed(5);
            
            allNotes[key].push(content);
            localStorage.setItem('myMapNotes', JSON.stringify(allNotes));

            // 更新当前地标的弹窗内容
            var marker = markers[key];
            if (marker) {
                marker.setPopupContent(generatePopupHTML(lat, lng, allNotes[key]));
            }
        }

        // 初始化加载
        loadAllMarkers();
    </script>
</body>
</html>
